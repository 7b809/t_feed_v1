<!-- templates/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>isolation_consumer_service · status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body { background: #f6f8fb; }

    .metric-card { transition: transform .15s ease, box-shadow .15s ease; }
    .metric-card:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1.25rem rgba(0,0,0,.08) !important; }

    .metric-icon { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; }

    .eyebrow { letter-spacing: .08em; }

    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #42d392;
      box-shadow: 0 0 0 0 rgba(66,211,146,.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(66,211,146,.7); }
      70%  { box-shadow: 0 0 0 8px rgba(66,211,146,0); }
      100% { box-shadow: 0 0 0 0 rgba(66,211,146,0); }
    }

    table td, table th { vertical-align: middle; }
    .table > :not(caption) > * > * { padding: .75rem 1rem; }
  </style>
</head>
<body>

<div class="container py-4 py-lg-5">

  <!-- ============================ PAGE HEADING ============================ -->
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4 pb-3 border-bottom">
    <div>
      <div class="eyebrow text-uppercase text-primary fw-semibold small mb-1">Service health</div>
      <h1 class="h3 fw-bold mb-2">isolation_consumer_service</h1>
      <p class="text-muted mb-0 d-flex align-items-center gap-2">
        <span class="pulse-dot"></span>
        Auto-refresh every 5s · <span id="ts" class="fw-medium">—</span>
      </p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge text-bg-light border fw-normal px-3 py-2" id="last-refresh">Connecting…</span>
      <button class="btn btn-primary btn-sm px-3 py-2" onclick="refresh()">
        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
      </button>
    </div>
  </div>

  <!-- ============================= METRIC CARDS ============================ -->
  <div class="row g-3 g-lg-4 mb-4">

    <!-- Overall -->
    <div class="col-6 col-md-3">
      <div class="card h-100 border-0 shadow-sm metric-card">
        <div class="card-body d-flex flex-column justify-content-between p-3 p-lg-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="text-uppercase text-muted small fw-semibold">Overall</span>
            <span class="metric-icon rounded-3 bg-success-subtle text-success" id="m-overall-icon">
              <i class="bi bi-heart-pulse"></i>
            </span>
          </div>
          <div class="fs-4 fw-bold lh-1" id="m-overall">—</div>
        </div>
      </div>
    </div>

    <!-- Isolations -->
    <div class="col-6 col-md-3">
      <div class="card h-100 border-0 shadow-sm metric-card">
        <div class="card-body d-flex flex-column justify-content-between p-3 p-lg-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="text-uppercase text-muted small fw-semibold">Isolations</span>
            <span class="metric-icon rounded-3 bg-primary-subtle text-primary">
              <i class="bi bi-layers"></i>
            </span>
          </div>
          <div class="fs-4 fw-bold lh-1" id="m-iso">—</div>
        </div>
      </div>
    </div>

    <!-- Active legs -->
    <div class="col-6 col-md-3">
      <div class="card h-100 border-0 shadow-sm metric-card">
        <div class="card-body d-flex flex-column justify-content-between p-3 p-lg-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="text-uppercase text-muted small fw-semibold">Active legs</span>
            <span class="metric-icon rounded-3 bg-info-subtle text-info">
              <i class="bi bi-diagram-3"></i>
            </span>
          </div>
          <div class="fs-4 fw-bold lh-1" id="m-legs">—</div>
        </div>
      </div>
    </div>

    <!-- Active connections -->
    <div class="col-6 col-md-3">
      <div class="card h-100 border-0 shadow-sm metric-card">
        <div class="card-body d-flex flex-column justify-content-between p-3 p-lg-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="text-uppercase text-muted small fw-semibold">Active connections</span>
            <span class="metric-icon rounded-3 bg-secondary-subtle text-secondary">
              <i class="bi bi-broadcast"></i>
            </span>
          </div>
          <div class="fs-4 fw-bold lh-1" id="m-conns">—</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ============================= CONNECTIONS ============================= -->
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-0 d-flex flex-wrap justify-content-between align-items-center gap-2 px-3 px-lg-4 pt-3 pt-lg-4 pb-0">
      <div>
        <h2 class="h5 fw-semibold mb-1">Live WebSocket connections</h2>
        <p class="text-muted small mb-0">Instrument, leg, state and last received frame</p>
      </div>
      <span class="badge text-bg-light border fw-normal px-3 py-2" id="conns-count">0 connections</span>
    </div>

    <div class="card-body p-0 mt-3">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">Instrument</th>
              <th scope="col">Leg</th>
              <th scope="col">State</th>
              <th scope="col">Last frame</th>
            </tr>
          </thead>
          <tbody id="conns">
            <tr>
              <td colspan="4" class="text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
                Loading…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ---------------------------------- helpers --------------------------------- */

function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function stateInfo(state) {
  switch ((state || '').toLowerCase()) {
    case 'connected':    return { cls: 'success',   icon: 'bi-check-circle-fill', label: 'Connected' };
    case 'failed':       return { cls: 'danger',    icon: 'bi-x-circle-fill',     label: 'Failed' };
    case 'reconnecting': return { cls: 'warning',   icon: 'bi-arrow-repeat',      label: 'Reconnecting' };
    case 'connecting':   return { cls: 'info',      icon: 'bi-hourglass-split',   label: 'Connecting' };
    case 'disconnected': return { cls: 'secondary', icon: 'bi-plug',              label: 'Disconnected' };
    default:             return { cls: 'secondary', icon: 'bi-dash-circle',       label: state || 'Unknown' };
  }
}

function stateBadge(state) {
  const i = stateInfo(state);
  return `<span class="badge rounded-pill text-bg-${i.cls}">
            <i class="bi ${i.icon} me-1"></i>${escapeHtml(i.label)}
          </span>`;
}

function formatDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return escapeHtml(v);
  return d.toLocaleString();
}

/* --------------------------------- refresh --------------------------------- */

async function refresh() {
  const tbody = document.getElementById('conns');
  const errorRow = `<tr>
      <td colspan="4" class="text-center text-danger py-4">
        <i class="bi bi-exclamation-triangle me-1"></i>
      </td>
    </tr>`;

  try {
    const r = await fetch('/api/v1/status', { cache: 'no-store' });
    if (!r.ok) throw new Error('Status API ' + r.status);

    const s = await r.json();
    const connections = s.connections || [];

    /* -------- summary -------- */
    const running = !!s.running;
    const overallEl = document.getElementById('m-overall');
    overallEl.textContent = running ? 'Running' : 'Stopped';
    overallEl.className = 'fs-4 fw-bold lh-1 ' + (running ? 'text-success' : 'text-danger');

    const iconWrap = document.getElementById('m-overall-icon');
    iconWrap.className = 'metric-icon rounded-3 ' +
      (running ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger');

    document.getElementById('m-iso').textContent   = s.isolation_count ?? 0;
    document.getElementById('m-legs').textContent  = s.active_legs ?? 0;
    document.getElementById('m-conns').textContent = connections.length;

    /* -------- connections table -------- */
    document.getElementById('conns-count').textContent =
      connections.length + (connections.length === 1 ? ' connection' : ' connections');

    if (connections.length === 0) {
      tbody.innerHTML = `<tr>
          <td colspan="4" class="text-center text-muted py-5">
            <i class="bi bi-broadcast d-block fs-3 mb-2"></i>
            No active connections
          </td>
        </tr>`;
    } else {
      tbody.innerHTML = connections.map(c => `
        <tr>
          <td><code class="text-body">${escapeHtml(c.instrument_key)}</code></td>
          <td><span class="badge text-bg-light border fw-normal">${escapeHtml(c.leg)}</span></td>
          <td>${stateBadge(c.ws_state)}</td>
          <td class="text-muted small">${formatDate(c.last_frame_at)}</td>
        </tr>
      `).join('');
    }

    /* -------- timestamp -------- */
    const now = new Date();
    document.getElementById('ts').textContent = now.toLocaleTimeString();
    document.getElementById('last-refresh').textContent = 'Updated ' + now.toLocaleTimeString();

  } catch (e) {
    tbody.innerHTML = `<tr>
        <td colspan="4" class="text-center text-danger py-4">
          <i class="bi bi-exclamation-triangle me-1"></i>${escapeHtml(e.message)}
        </td>
      </tr>`;
    document.getElementById('last-refresh').textContent = 'Update failed';
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
