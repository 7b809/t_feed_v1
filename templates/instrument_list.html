{% extends "base.html" %}
{% block title %}Charts{% endblock %}
{% block content %}
<div class="container py-5">
  <h1 class="h2">Charts</h1>
  <p class="text-secondary">Open a historical candlestick chart by instrument key.</p>
  <div class="card border-0 shadow-sm mt-4" style="max-width: 680px">
    <div class="card-body p-4">
      <form id="chart-form" class="mb-3">
        <label class="form-label" for="instrument-key">Upstox instrument key</label>
        <div class="input-group">
          <input id="instrument-key" class="form-control" required placeholder="NSE_INDEX|Nifty 50">
          <button class="btn btn-primary">Open chart</button>
        </div>
      </form>
      <a href="/chart/NSE_INDEX%7CNifty%2050">NIFTY 50</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("chart-form").addEventListener("submit", event => {
  event.preventDefault();
  const key = document.getElementById("instrument-key").value.trim();
  if (key) window.location.href = "/chart/" + encodeURIComponent(key);
});
</script>
{% endblock %}
