{% extends "base.html" %}
{% block title %}Application Logs{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h3">Application logs</h1>
  <p class="text-secondary">Read recent runtime logs for application diagnostics.</p>
  <div class="row g-3 align-items-end mb-3">
    <div class="col-sm-4 col-md-3">
      <label class="form-label" for="source">Log source</label>
      <select id="source" class="form-select">
        <option value="logs">Rotating logs</option>
        <option value="logs_text">Plain text logs</option>
      </select>
    </div>
    <div class="col-sm-8 col-md-5">
      <label class="form-label" for="file">File</label>
      <select id="file" class="form-select"></select>
    </div>
    <div class="col-md-4"><button id="refresh" class="btn btn-primary">Refresh</button></div>
  </div>
  <pre id="content" class="p-3 rounded bg-dark text-light" style="min-height:55vh;max-height:70vh;overflow:auto;white-space:pre-wrap">Choose a log file.</pre>
</div>
{% endblock %}
{% block scripts %}
<script>
const source = document.getElementById("source");
const file = document.getElementById("file");
const content = document.getElementById("content");
async function loadFiles() {
  const response = await fetch(`/api/logs?source=${encodeURIComponent(source.value)}`);
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const result = await response.json();
  file.replaceChildren(...result.files.map(item => new Option(item.name, item.name)));
  if (file.value) await loadContent(); else content.textContent = "No log files are available yet.";
}
async function loadContent() {
  if (!file.value) return;
  const path = `/api/logs/${encodeURIComponent(file.value)}?source=${encodeURIComponent(source.value)}`;
  const response = await fetch(path);
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const result = await response.json();
  content.textContent = result.lines.join("\n");
  content.scrollTop = content.scrollHeight;
}
document.getElementById("refresh").addEventListener("click", () => loadFiles().catch(() => content.textContent = "Unable to load logs."));
source.addEventListener("change", () => loadFiles().catch(() => content.textContent = "Unable to load logs."));
file.addEventListener("change", () => loadContent().catch(() => content.textContent = "Unable to load this log."));
loadFiles().catch(() => content.textContent = "Unable to load logs.");
</script>
{% endblock %}
