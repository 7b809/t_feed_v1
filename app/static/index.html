<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dual WS Feed Capture</title><style>
:root{color-scheme:dark}body{margin:0;font:15px system-ui;background:#07111f;color:#dce8f7}.wrap{max-width:1100px;margin:50px auto;padding:20px}h1{font-size:40px;margin:0}.muted{color:#8da3bd}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}.card{background:#101d2e;border:1px solid #253954;border-radius:16px;padding:18px}.card b{display:block;font-size:28px;margin-top:7px}.ok{color:#4ade80}.bad{color:#fb7185}button,a{background:#38bdf8;color:#052033;border:0;border-radius:9px;padding:10px 14px;font-weight:700;text-decoration:none;margin-right:8px}pre{background:#0b1726;border:1px solid #253954;border-radius:14px;padding:18px;overflow:auto}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><p class="muted">MARKET DATA SERVICE</p><h1>Dual WebSocket Feed Capture</h1><p class="muted">EMA and raw feeds, controlled by India market hours.</p><div class="cards"><div class="card">Supervisor<b id="running">...</b></div><div class="card">Market hours<b id="market">...</b></div><div class="card">Instruments<b id="instruments">...</b></div><div class="card">Messages<b id="messages">...</b></div></div><p><button onclick="act('start')">Start</button><button onclick="act('stop')">Stop</button><button onclick="act('refresh')">Refresh</button><a href="/docs">API docs</a></p><pre id="status">Loading...</pre></main><script>
async function load(){try{let [h,s]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/status').then(r=>r.json())]);running.textContent=h.supervisor_running?'Running':'Stopped';running.className=h.supervisor_running?'ok':'bad';market.textContent=h.in_market_hours?'Open':'Closed';instruments.textContent=h.instruments;messages.textContent=h.total_messages_written.toLocaleString();status.textContent=JSON.stringify(s,null,2)}catch(e){status.textContent=e}} async function act(x){await fetch('/api/'+x,{method:'POST'});load()}load();setInterval(load,5000)</script></body></html>
