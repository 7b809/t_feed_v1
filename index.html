<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Option Feed Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --accent: #3b82f6;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    h1, h2 {
      margin: 0;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .connected { background: rgba(34, 197, 94, 0.2); color: var(--green); border: 1px solid var(--green); }
    .disconnected { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }

    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      position: relative;
    }

    .symbol { font-weight: bold; font-size: 1rem; }
    .ltp { font-size: 1.4rem; font-weight: bold; margin: 8px 0; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    .details-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .greeks-box {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Option Feed Dashboard</h1>
    <div>
      <span id="status-all" class="status-badge disconnected">/all-feeds: Off</span>
      <span id="status-option" class="status-badge disconnected">/option: Off</span>
    </div>
  </header>

  <div class="main-grid">
    
    <!-- Single Option Filtered Feed -->
    <div class="panel">
      <h2>Target Option Watch</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Filtered: NIFTY 24500 CE</p>
      
      <div id="single-option-card" class="card" style="margin-top: 15px;">
        <div class="symbol">NIFTY 24500 CE</div>
        <div id="target-ltp" class="ltp">₹ --.--</div>
        <div class="details-row">
          <span>OHLC</span>
          <span id="target-ohlc">O: -- | H: -- | L: --</span>
        </div>
        <div class="details-row">
          <span>Volume / OI</span>
          <span id="target-vol">Vol: -- | OI: --</span>
        </div>
        
        <div class="greeks-box">
          <div class="details-row">
            <span>IV: <b id="target-iv">--%</b></span>
            <span>Delta: <b id="target-delta">--</b></span>
            <span>Theta: <b id="target-theta">--</b></span>
          </div>
        </div>
      </div>
    </div>

    <!-- All Subscribed Instruments Live Grid -->
    <div class="panel">
      <h2>All Feeds Stream (<span id="active-count">0</span> Instruments Active)</h2>
      <div id="all-feeds-container" class="options-grid"></div>
    </div>

  </div>

  <script>
    const wsHost = `ws://${window.location.hostname || 'localhost'}:8000`;
    
    // Store latest state per instrument_key to prevent constant re-rendering/flicker
    const feedsStore = new Map();

    // 1. Connect to Filtered Single Option Feed
    function connectOptionFeed() {
      const ws = new WebSocket(`${wsHost}/option?strike=24500&striketype=ce`);
      const statusBadge = document.getElementById("status-option");

      ws.onopen = () => {
        statusBadge.className = "status-badge connected";
        statusBadge.textContent = "/option (24500 CE): Live";
      };

      ws.onmessage = (event) => {
        const tick = JSON.parse(event.data);
        updateTargetCard(tick);
      };

      ws.onclose = () => {
        statusBadge.className = "status-badge disconnected";
        statusBadge.textContent = "/option: Disconnected";
        setTimeout(connectOptionFeed, 3000); // Auto reconnect
      };
    }

    // 2. Connect to All Feeds Endpoint
    function connectAllFeeds() {
      const ws = new WebSocket(`${wsHost}/all-feeds`);
      const statusBadge = document.getElementById("status-all");

      ws.onopen = () => {
        statusBadge.className = "status-badge connected";
        statusBadge.textContent = "/all-feeds: Live";
      };

      ws.onmessage = (event) => {
        const tick = JSON.parse(event.data);
        feedsStore.set(tick.instrument_key, tick);
        renderAllFeedsGrid();
      };

      ws.onclose = () => {
        statusBadge.className = "status-badge disconnected";
        statusBadge.textContent = "/all-feeds: Disconnected";
        setTimeout(connectAllFeeds, 3000); // Auto reconnect
      };
    }

    // Render single target card
    function updateTargetCard(tick) {
      const changeClass = tick.change >= 0 ? 'up' : 'down';
      document.getElementById("target-ltp").className = `ltp ${changeClass}`;
      document.getElementById("target-ltp").innerHTML = `₹${tick.ltp.toFixed(2)} <small style="font-size:0.8rem">(${tick.change >= 0 ? '+' : ''}${tick.change.toFixed(2)})</small>`;
      
      document.getElementById("target-ohlc").textContent = `O: ${tick.open} | H: ${tick.high} | L: ${tick.low}`;
      document.getElementById("target-vol").textContent = `Vol: ${tick.volume.toLocaleString()} | OI: ${tick.oi.toLocaleString()}`;

      if (tick.greeks) {
        const rawIv = tick.greeks.iv || 0;
        const ivPct = rawIv <= 1.0 ? rawIv * 100 : rawIv;
        document.getElementById("target-iv").textContent = `${ivPct.toFixed(2)}%`;
        document.getElementById("target-delta").textContent = (tick.greeks.delta || 0).toFixed(4);
        document.getElementById("target-theta").textContent = (tick.greeks.theta || 0).toFixed(4);
      }
    }

    // Render/refresh all feeds grid cleanly
    function renderAllFeedsGrid() {
      const container = document.getElementById("all-feeds-container");
      document.getElementById("active-count").textContent = feedsStore.size;

      // Update or Create DOM cards directly without clearing innerHTML to stop flickering
      feedsStore.forEach((tick, key) => {
        let card = document.getElementById(`card-${key.replace(/[^a-zA-Z0-9]/g, '_')}`);
        const symbol = tick.info.trading_symbol || key;
        const changeClass = tick.change >= 0 ? 'up' : 'down';

        if (!card) {
          card = document.createElement("div");
          card.id = `card-${key.replace(/[^a-zA-Z0-9]/g, '_')}`;
          card.className = "card";
          container.appendChild(card);
        }

        card.innerHTML = `
          <div class="symbol">${symbol}</div>
          <div class="ltp ${changeClass}">₹${tick.ltp.toFixed(2)}</div>
          <div class="details-row">
            <span>Change</span>
            <span class="${changeClass}">${tick.change >= 0 ? '+' : ''}${tick.change.toFixed(2)} (${tick.change_pct.toFixed(2)}%)</span>
          </div>
          <div class="details-row">
            <span>Volume</span>
            <span>${tick.volume.toLocaleString()}</span>
          </div>
        `;
      });
    }

    // Start WebSocket connections
    connectOptionFeed();
    connectAllFeeds();
  </script>
</body>
</html>
