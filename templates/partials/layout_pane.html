{# File: templates/partials/layout_pane.html #}
{# One pane of the multi-chart layout. Matches the JS buildPaneHtml() shape,
   including the metadata panel below the chart. #}
<div class="pane" data-pane-index="{{ pane_index }}" data-instrument-key="{{ pane.instrument_key }}" data-active="{{ 'true' if pane_index == 0 else 'false' }}">
  <div class="pane-header">
    <div class="pane-symbol">
      <i class="bi bi-graph-up-arrow text-primary me-1"></i>
      <span class="pane-symbol-text">{{ pane.instrument_key }}</span>
    </div>
    <div class="pane-actions">
      <button class="pane-btn" data-pane-action="change" data-pane-index="{{ pane_index }}" title="Change instrument (opens search)">
        <i class="bi bi-arrow-left-right"></i>
      </button>
      <button class="pane-btn" data-pane-action="link" data-pane-index="{{ pane_index }}" title="Toggle link to other panes">
        <i class="bi bi-link-45deg"></i>
      </button>
    </div>
  </div>
  <div class="pane-chart-wrap">
    <div class="pane-body" id="pane-chart-{{ pane_index }}"></div>
    <div class="pane-label-layer" id="pane-label-layer-{{ pane_index }}"></div>
  </div>
  <div class="pane-meta" id="pane-meta-{{ pane_index }}">
    <div class="pane-meta-header">
      <span class="pane-meta-symbol">{{ pane.instrument_key }}</span>
      <span class="pane-meta-type-pill other">—</span>
      <span class="pane-meta-segment">—</span>
    </div>
    <div class="pane-meta-grid">
      <div class="pane-meta-cell"><div class="label">LTP</div><div class="value" data-meta="ltp">--</div></div>
      <div class="pane-meta-cell"><div class="label">Change</div><div class="value" data-meta="change">--</div></div>
      <div class="pane-meta-cell"><div class="label">Volume</div><div class="value" data-meta="volume">--</div></div>
      <div class="pane-meta-cell"><div class="label">Expiry</div><div class="value" data-meta="expiry">--</div></div>
      <div class="pane-meta-cell"><div class="label">Open</div><div class="value" data-meta="open">--</div></div>
      <div class="pane-meta-cell"><div class="label">High</div><div class="value" data-meta="high">--</div></div>
      <div class="pane-meta-cell"><div class="label">Low</div><div class="value" data-meta="low">--</div></div>
      <div class="pane-meta-cell"><div class="label">Close</div><div class="value" data-meta="close">--</div></div>
    </div>
  </div>
</div>
