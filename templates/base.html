<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101828"><title>{{ page_title }} · OrderFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--ink:#172033;--muted:#667085;--line:#e7ebf1;--bg:#f5f7fb;--navy:#101828;--blue:#315efb}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.navbar{background:var(--navy);box-shadow:0 4px 18px #10182820}.brand-mark{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}.navbar .nav-link{color:#b9c3d2;border-radius:8px;padding:.55rem .85rem;font-weight:600}.navbar .nav-link.active,.navbar .nav-link:hover{color:#fff;background:#ffffff1a}
.page-wrap{max-width:1500px;margin:auto;padding:30px 22px 50px}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.page-heading h1{font-size:clamp(1.55rem,3vw,2rem);font-weight:800;letter-spacing:-.04em;margin:.25rem 0 .35rem}.subheading{color:var(--muted);font-size:.92rem;margin:0}
.surface,.metric-card,.instrument-card,.isolation-card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 14px #10182809}.surface{padding:20px}.metric-card{padding:18px 20px;height:100%}.metric-label,.meta-label{color:var(--muted);font-size:.74rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em}.metric-value{font-size:1.8rem;font-weight:800;letter-spacing:-.04em;margin-top:6px}.section-title{font-size:1rem;font-weight:800;margin:0}.section-note{color:var(--muted);font-size:.82rem}.instrument-card{padding:18px;height:100%;transition:.15s}.instrument-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #10182814}.instrument-symbol{font-weight:800;font-size:1rem}.instrument-key{font-size:.72rem;color:var(--muted);word-break:break-all}.ltp{font-size:1.8rem;font-weight:800;letter-spacing:-.05em}.meta-value{font-size:.84rem;font-weight:650}.badge-soft{background:#f2f4f7;color:#475467;border:1px solid #eaecf0}.badge-success-soft{background:#ecfdf3;color:#027a48;border:1px solid #abefc6}.badge-warning-soft{background:#fffaeb;color:#b54708;border:1px solid #fedf89}.badge-danger-soft{background:#fef3f2;color:#b42318;border:1px solid #fecdca}.table{--bs-table-bg:transparent;vertical-align:middle}.table thead th{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:800;white-space:nowrap}.table td{font-size:.84rem}.form-control,.form-select,.btn{border-radius:9px}.empty-state{padding:42px 18px;text-align:center;color:var(--muted)}.empty-state i{font-size:2rem;display:block;margin-bottom:10px;color:#98a2b3}.footer-note{color:#98a2b3;font-size:.75rem;text-align:center;padding-top:26px}
@media(max-width:767.98px){.page-wrap{padding:22px 14px 38px}.page-heading{flex-direction:column}.surface{padding:15px}.metric-value{font-size:1.55rem}}
</style>{% block head %}{% endblock %}</head><body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top"><div class="container-fluid px-lg-4"><a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/"><span class="brand-mark">OF</span><span>OrderFlow<small class="fw-normal text-white-50 d-block" style="font-size:.62rem;letter-spacing:.12em">TRADING OPERATIONS</small></span></a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto gap-lg-1 mt-3 mt-lg-0"><a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/"><i class="bi bi-grid-1x2-fill me-1"></i>Overview</a><a class="nav-link {% if active_page == 'isolated' %}active{% endif %}" href="/isolated"><i class="bi bi-intersect me-1"></i>Isolated</a><a class="nav-link {% if active_page == 'orders' %}active{% endif %}" href="/orders"><i class="bi bi-receipt me-1"></i>Orders</a></div><div class="ms-lg-4 mt-3 mt-lg-0 small text-white-50"><span class="text-success">●</span> Dashboard online</div></div></div></nav>
<main class="page-wrap">{% block content %}{% endblock %}<div class="footer-note">OrderFlow · Monitoring and local simulation dashboard · Times shown in Asia/Kolkata</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatPrice(v){return v===null||v===undefined||v===''?'—':Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function formatDate(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?escapeHtml(v):d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function stateBadge(v){const s=String(v||'unknown').toLowerCase(),c=(s==='connected'||s==='live'||s==='target'||s==='completed_target')?'badge-success-soft':(s.includes('fail')||s.includes('stop_loss')?'badge-danger-soft':(s.includes('connect')||s.includes('reconnect')||s==='subscribing'?'badge-warning-soft':'badge-soft'));return '<span class="badge rounded-pill '+c+'">'+escapeHtml(v||'unknown')+'</span>';}
function setRefreshTime(){const e=document.getElementById('last-refresh');if(e)e.textContent='Updated '+new Date().toLocaleTimeString('en-IN');}
</script>{% block scripts %}{% endblock %}</body></html>
