<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logs · Ordered Instrument Jobs</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-body-tertiary">

  <!-- ================================================================= -->
  <!-- Top navbar                                                        -->
  <!-- ================================================================= -->
  <nav class="navbar navbar-expand bg-body-secondary border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a href="/" class="d-flex align-items-center gap-2 text-decoration-none text-body">
        <i class="bi bi-journal-text fs-4 text-info"></i>
        <div class="lh-1">
          <div class="text-uppercase text-info fw-bold"
               style="font-size:.68rem;letter-spacing:.16em;">
            Project logs
          </div>
          <h1 class="h5 mb-0">Log viewer</h1>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Dashboard
        </a>
      </div>
    </div>
  </nav>

  <!-- ================================================================= -->
  <!-- Main content                                                      -->
  <!-- ================================================================= -->
  <main class="container-fluid px-3 py-3">
    <div class="row g-3">

      <!-- ============================================================ -->
      <!-- Sidebar: file list + filename search                         -->
      <!-- ============================================================ -->
      <div class="col-12 col-lg-3 col-xxl-2">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-body-secondary d-flex justify-content-between align-items-center">
            <span class="fw-bold text-uppercase small">
              <i class="bi bi-folder2-open me-1"></i>Log files
            </span>
            <span id="file-count" class="badge text-bg-secondary">0</span>
          </div>

          <div class="card-body border-bottom">
            <div class="input-group input-group-sm mb-2">
              <span class="input-group-text bg-body-secondary">
                <i class="bi bi-search"></i>
              </span>
              <input id="file-search" class="form-control"
                     placeholder="Search file names…">
            </div>

            <div class="d-flex flex-wrap gap-2 align-items-center">
              <div class="form-check form-switch mb-0">
                <input id="include-modules" class="form-check-input"
                       type="checkbox" checked>
                <label class="form-check-label small" for="include-modules">
                  Include modules
                </label>
              </div>
              <button id="files-refresh"
                      class="btn btn-outline-secondary btn-sm ms-auto"
                      title="Reload file list">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
            </div>

            <div class="mt-2">
              <div class="btn-group btn-group-sm w-100" role="group"
                   aria-label="Filter by source">
                <input type="radio" class="btn-check" name="filter-source"
                       id="filter-all" value="all" checked>
                <label class="btn btn-outline-secondary" for="filter-all">All</label>

                <input type="radio" class="btn-check" name="filter-source"
                       id="filter-combined" value="combined">
                <label class="btn btn-outline-secondary" for="filter-combined">Combined</label>

                <input type="radio" class="btn-check" name="filter-source"
                       id="filter-module" value="module">
                <label class="btn btn-outline-secondary" for="filter-module">Modules</label>
              </div>
            </div>
          </div>

          <div id="file-list" class="list-group list-group-flush log-file-list">
            <div class="list-group-item text-secondary small">Loading…</div>
          </div>
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- Viewer                                                        -->
      <!-- ============================================================ -->
      <div class="col-12 col-lg-9 col-xxl-10">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-body-secondary d-flex flex-wrap gap-2
                      justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2 text-truncate">
              <i class="bi bi-file-earmark-text text-info"></i>
              <span id="current-file" class="fw-semibold text-truncate">
                Select a log file
              </span>
              <span id="current-file-meta" class="text-secondary small"></span>
            </div>

            <div class="d-flex flex-wrap gap-1">
              <div class="btn-group btn-group-sm" role="group" aria-label="Zoom">
                <button id="zoom-out" class="btn btn-outline-secondary"
                        title="Zoom out (Ctrl -)">
                  <i class="bi bi-zoom-out"></i>
                </button>
                <button id="zoom-reset" class="btn btn-outline-secondary"
                        title="Reset zoom (Ctrl 0)">
                  <span id="zoom-label" class="small">100%</span>
                </button>
                <button id="zoom-in" class="btn btn-outline-secondary"
                        title="Zoom in (Ctrl +)">
                  <i class="bi bi-zoom-in"></i>
                </button>
              </div>

              <div class="btn-group btn-group-sm" role="group" aria-label="Actions">
                <button id="copy-btn" class="btn btn-outline-secondary"
                        title="Copy log content">
                  <i class="bi bi-clipboard"></i>
                </button>
                <button id="download-btn" class="btn btn-outline-secondary"
                        title="Download log file">
                  <i class="bi bi-download"></i>
                </button>
                <button id="reload-btn" class="btn btn-outline-secondary"
                        title="Reload file">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button id="auto-refresh-btn" class="btn btn-outline-secondary"
                        title="Toggle auto refresh every 3s">
                  <i class="bi bi-play-circle"></i>
                </button>
                <button id="wrap-btn" class="btn btn-outline-secondary"
                        title="Toggle line wrap">
                  <i class="bi bi-text-wrap"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="card-body p-0">
            <!-- Toolbar: in-content search -->
            <div class="log-toolbar border-bottom px-3 py-2 d-flex flex-wrap
                        gap-2 align-items-center bg-body-tertiary">
              <div class="input-group input-group-sm" style="max-width: 380px;">
                <span class="input-group-text bg-body-secondary">
                  <i class="bi bi-search"></i>
                </span>
                <input id="content-search" class="form-control"
                       placeholder="Search inside log…">
                <button id="content-search-clear"
                        class="btn btn-outline-secondary" type="button"
                        title="Clear search">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>

              <span id="match-count" class="small text-secondary"></span>

              <div class="ms-auto d-flex align-items-center gap-2 small">
                <label for="lines-select" class="text-secondary mb-0">
                  Show last
                </label>
                <select id="lines-select" class="form-select form-select-sm"
                        style="width:auto;">
                  <option value="200">200 lines</option>
                  <option value="500">500 lines</option>
                  <option value="1000" selected>1000 lines</option>
                  <option value="5000">5000 lines</option>
                  <option value="0">All</option>
                </select>
                <span id="auto-refresh-status"
                      class="badge text-bg-success d-none">
                  <span class="pulse-dot me-1"></span>Auto
                </span>
              </div>
            </div>

            <pre id="log-content" class="log-viewer"><span class="text-secondary">Select a log file from the left to view its contents.</span></pre>
          </div>

          <div class="card-footer bg-body-secondary small text-secondary
                      d-flex justify-content-between flex-wrap gap-2">
            <span id="footer-info" class="text-truncate">—</span>
            <span id="footer-status"></span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Toast container -->
  <div id="toast" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/logs.js"></script>
</body>
</html>
