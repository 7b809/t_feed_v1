<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Trading Dashboard{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #131722;
            color: #d1d4dc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        .navbar-brand {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 10px;
        }

        .nav-link {
            padding: 10px 14px;
            background: #2a2e39;
            border-radius: 6px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .nav-link:hover {
            background: #2962ff;
        }

        .content {
            width: 100%;
        }

        @media (max-width: 640px) {
            .navbar {
                padding: 0 10px;
            }

            .navbar-brand {
                font-size: 14px;
            }

            .navbar-links {
                gap: 5px;
            }

            .nav-link {
                padding: 8px 10px;
                font-size: 11px;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

<nav class="navbar">

    <a href="/" class="navbar-brand">
        Trading Dashboard
    </a>

    <div class="navbar-links">

        <a href="/" class="nav-link">
            Home
        </a>

        <a href="javascript:void(0)" onclick="openIsolatedDashboard()" class="nav-link">
            Isolated EMA
        </a>

        <a href="/charts" class="nav-link">
            Charts
        </a>

    </div>

</nav>

<div class="content">
    {% block content %}{% endblock %}
</div>

<script>
    // Define apiHost or fallback to current origin
    const apiHost = window.apiHost || window.location.origin;

    function openIsolatedDashboard() {
        window.location.href = `${apiHost}/isolated-dashboard`;
    }
</script>

{% block scripts %}{% endblock %}

</body>
</html>
