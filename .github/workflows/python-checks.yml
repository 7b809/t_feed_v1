name: Python syntax and Telegram formatting checks

on:
  push:
    branches:
      - market-engine-v4-unified-path-a
  pull_request:
    branches:
      - market-engine-v4
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run Telegram formatter tests
        run: python -m unittest discover -s tests -p "test_telegram_format.py" -v
