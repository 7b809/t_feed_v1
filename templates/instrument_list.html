{% extends "base.html" %}

{% block title %}Instrument Search{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
:root {
    --bg-body: #f4f7fe;
    --bg-card: #ffffff;
    --text-primary: #1b2559;
    --text-secondary: #707eae;
    --text-muted: #8f9bba;
    --border-color: #e9edf7;
    --accent-blue: #4318ff;
    --accent-call: #05cd99;
    --accent-put: #ee5d50;
    --card-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
}

body { background-color: var(--bg-body); color: var(--text-primary); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }

.page-header { background: #ffffff; border-bottom: 1px solid var(--border-color); padding: 16px 32px; box-shadow: 0px 4px 20px rgba(112, 144, 176, 0.06); }
.brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #868CFF 0%, #4318FF 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0px 6px 14px rgba(67, 24, 255, 0.35); }

.instrument-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: var(--card-shadow); overflow: hidden; }
.panel-header { background: #ffffff; padding: 20px 24px 16px 24px; border-bottom: 1px solid var(--border-color); }
.search-group { position: relative; }
.search-group .bi-search { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 16px; }
.search-box { background-color: #f4f7fe; border: 1px solid transparent; border-radius: 14px; padding: 12px 16px 12px 46px; font-size: 14px; font-weight: 500; color: var(--text-primary); transition: all 0.2s; width: 100%; }
.search-box:focus { background-color: #ffffff; border-color: var(--accent-blue); box-shadow: 0px 0px 0px 4px rgba(67, 24, 255, 0.1); outline: none; }

.filters-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.filter-select { background: #f4f7fe; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--text-primary); }
.filter-select:focus { outline: none; border-color: var(--accent-blue); }

.nav-pills-custom { background: #f4f7fe; padding: 4px; border-radius: 12px; display: flex; gap: 4px; }
.nav-pills-custom .tab-button { flex: 1; border: none; background: transparent; color: var(--text-secondary); font-weight: 700; font-size: 13px; padding: 10px 16px; border-radius: 10px; transition: all 0.2s; }
.nav-pills-custom .tab-button.active { background: #ffffff; color: var(--accent-blue); box-shadow: 0px 4px 12px rgba(112, 144, 176, 0.15); }

.panel-body { max-height: calc(100vh - 320px); min-height: 260px; padding: 24px; overflow-y: auto; }
.panel-body::-webkit-scrollbar { width: 6px; }
.panel-body::-webkit-scrollbar-thumb { background: #d0d9f0; border-radius: 10px; }

.instrument-card { display: block; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px 22px; margin-bottom: 12px; text-decoration: none; color: #f8fafc; transition: all 0.2s; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15); }
.instrument-card:hover { background: #273449; border-color: #475569; color: #ffffff; transform: translateY(-2px); box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.22); }
.instrument-card .instrument-symbol { color: #ffffff; font-weight: 700; font-size: 14px; }
.instrument-card .instrument-details { color: #cbd5e1; font-size: 12px; margin-top: 4px; }

.type-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
.type-pill.ce { background: rgba(5, 205, 153, 0.15); color: var(--accent-call); }
.type-pill.pe { background: rgba(238, 93, 80, 0.15); color: var(--accent-put); }
.type-pill.index { background: rgba(67, 24, 255, 0.12); color: var(--accent-blue); }
.type-pill.other { background: rgba(112, 126, 174, 0.15); color: var(--text-secondary); }

.section-heading { font-size: 12px; font-weight: 800; color: var(--text-primary); margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }

.no-results, .empty-message { color: var(--text-muted); font-size: 13px; font-weight: 600; text-align: center; padding: 40px 20px; }
.no-results i, .empty-message i { font-size: 2rem; display: block; margin-bottom: 10px; opacity: 0.4; }

.pagination-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-top: 1px solid var(--border-color); }
.page-btn { background: #f4f7fe; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-primary); cursor: pointer; transition: all 0.15s; }
.page-btn:hover:not(:disabled) { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.spinner-inline { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(67,24,255,0.25); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

[hidden] { display: none !important; }
</style>
{% endblock %}

{% block content %}
<header class="page-header d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
        <div class="brand-icon"><i class="bi bi-search"></i></div>
        <div>
            <h1 class="h5 mb-0 fw-bold">Instrument Search</h1>
            <span class="small text-muted fw-medium">Search across NSE / BSE / MCX</span>
        </div>
    </div>
    <div class="badge px-3 py-2 rounded-pill" style="background: rgba(67,24,255,0.08); color: var(--accent-blue); font-size: 12px; font-weight: 700;">
        <i class="bi bi-cloud-check-fill me-1"></i> Live Upstox feed
    </div>
</header>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
            <section class="instrument-panel">

                <div class="panel-header">
                    <div class="search-group">
                        <i class="bi bi-search"></i>
                        <input type="search" id="searchInput" class="search-box"
                               placeholder="Search symbol, strike, ISIN… (e.g. NIFTY 23500 CE)"
                               autocomplete="off" />
                    </div>

                    <div class="filters-row">
                        <select id="exchangeFilter" class="filter-select">
                            <option value="">All Exchanges</option>
                            <option value="NSE">NSE</option>
                            <option value="BSE">BSE</option>
                            <option value="MCX">MCX</option>
                        </select>
                        <select id="segmentFilter" class="filter-select">
                            <option value="">All Segments</option>
                            <option value="EQ">Equity (EQ)</option>
                            <option value="FO">F&amp;O</option>
                            <option value="INDEX">Index</option>
                            <option value="CURR">Currency</option>
                            <option value="COMM">Commodity</option>
                        </select>
                        <select id="typeFilter" class="filter-select">
                            <option value="">All Types</option>
                            <option value="CE">CE</option>
                            <option value="PE">PE</option>
                            <option value="FUT">FUT</option>
                        </select>
                        <select id="expiryFilter" class="filter-select">
                            <option value="">Any Expiry</option>
                            <option value="current_week">Current Week</option>
                            <option value="next_week">Next Week</option>
                            <option value="current_month">Current Month</option>
                            <option value="next_month">Next Month</option>
                        </select>
                    </div>
                </div>

                <div class="panel-body" id="resultsBody">
                    <div class="empty-message">
                        <i class="bi bi-search"></i>
                        Start typing to search across indices, options, futures and equities.
                    </div>
                </div>

                <div class="pagination-bar" id="paginationBar" hidden>
                    <button class="page-btn" id="prevPageBtn" disabled><i class="bi bi-chevron-left me-1"></i>Previous</button>
                    <span class="small text-muted fw-bold" id="pageInfo">Page 1</span>
                    <button class="page-btn" id="nextPageBtn" disabled>Next<i class="bi bi-chevron-right ms-1"></i></button>
                </div>

            </section>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    const searchInput   = document.getElementById("searchInput");
    const exchangeFilter= document.getElementById("exchangeFilter");
    const segmentFilter = document.getElementById("segmentFilter");
    const typeFilter    = document.getElementById("typeFilter");
    const expiryFilter  = document.getElementById("expiryFilter");
    const resultsBody   = document.getElementById("resultsBody");
    const paginationBar = document.getElementById("paginationBar");
    const prevPageBtn   = document.getElementById("prevPageBtn");
    const nextPageBtn   = document.getElementById("nextPageBtn");
    const pageInfo      = document.getElementById("pageInfo");

    const PAGE_SIZE = 20;
    let currentPage = 1;
    let totalPages  = 1;
    let lastQuery   = "";
    let debounceTimer = null;
    let inFlight    = null;

    function pillClass(item) {
        const t = String(item.instrument_type || "").toUpperCase();
        if (t === "CE") return "ce";
        if (t === "PE") return "pe";
        if (t === "INDEX" || String(item.segment || "").includes("INDEX")) return "index";
        return "other";
    }

    function fmt(value, decimals) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        return decimals !== undefined ? n.toFixed(decimals) : n.toString();
    }

    function renderResults(data) {
        const items = (data && data.data) || [];
        if (!items.length) {
            resultsBody.innerHTML = `
                <div class="empty-message">
                    <i class="bi bi-inbox"></i>
                    No instruments match your search.
                </div>`;
            return;
        }

        const html = items.map(item => {
            const key = item.instrument_key || "";
            const symbol = item.trading_symbol || item.name || key;
            const pill = pillClass(item);
            const typeLabel = String(item.instrument_type || "—").toUpperCase();

            const bits = [];
            if (item.underlying_symbol) bits.push(`<strong>${item.underlying_symbol}</strong>`);
            if (item.strike_price !== undefined && item.strike_price !== null) bits.push(`Strike: ${fmt(item.strike_price, 0)}`);
            if (item.expiry) bits.push(`Expiry: ${item.expiry}`);
            if (item.exchange) bits.push(item.exchange);
            if (item.lot_size) bits.push(`Lot: ${fmt(item.lot_size)}`);

            return `
                <a href="/chart/${encodeURIComponent(key)}" class="instrument-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div style="min-width:0;">
                            <div class="instrument-symbol text-truncate">${symbol}</div>
                            <div class="instrument-details">${bits.join(' &middot; ')}</div>
                        </div>
                        <span class="type-pill ${pill}">${typeLabel}</span>
                    </div>
                </a>
            `;
        }).join("");

        resultsBody.innerHTML = html;
    }

    async function runSearch(page) {
        const q = searchInput.value.trim();
        if (!q) {
            resultsBody.innerHTML = `
                <div class="empty-message">
                    <i class="bi bi-search"></i>
                    Start typing to search across indices, options, futures and equities.
                </div>`;
            paginationBar.hidden = true;
            return;
        }
        if (q.length < 2) {
            resultsBody.innerHTML = `<div class="empty-message"><i class="bi bi-info-circle"></i>Type at least 2 characters.</div>`;
            paginationBar.hidden = true;
            return;
        }

        lastQuery = q;
        currentPage = page || 1;

        resultsBody.innerHTML = `<div class="empty-message"><span class="spinner-inline"></span>Searching…</div>`;
        paginationBar.hidden = true;

        if (inFlight) inFlight.abort();
        inFlight = new AbortController();

        const params = new URLSearchParams({
            query: q,
            page_number: String(currentPage),
            records: String(PAGE_SIZE),
        });
        if (exchangeFilter.value) params.set("exchanges", exchangeFilter.value);
        if (segmentFilter.value)  params.set("segments", segmentFilter.value);
        if (typeFilter.value)     params.set("instrument_types", typeFilter.value);
        if (expiryFilter.value)   params.set("expiry", expiryFilter.value);

        try {
            const resp = await fetch(`/api/upstox/search?${params.toString()}`, {
                method: "GET",
                signal: inFlight.signal,
            });
            if (!resp.ok) {
                const text = await resp.text();
                throw new Error(`Search failed (${resp.status}) ${text.slice(0, 200)}`);
            }
            const data = await resp.json();
            renderResults(data);

            const meta = (data && data.meta_data && data.meta_data.page) || {};
            totalPages = meta.total_pages || 1;
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}  ·  ${meta.total_records || 0} results`;
            paginationBar.hidden = totalPages <= 1;
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= totalPages;
        } catch (err) {
            if (err.name === "AbortError") return;
            console.error(err);
            resultsBody.innerHTML = `<div class="empty-message text-danger"><i class="bi bi-exclamation-triangle"></i>${err.message}</div>`;
            paginationBar.hidden = true;
        }
    }

    function scheduleSearch() {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => runSearch(1), 350);
    }

    searchInput.addEventListener("input", scheduleSearch);
    [exchangeFilter, segmentFilter, typeFilter, expiryFilter].forEach(el => {
        el.addEventListener("change", () => runSearch(1));
    });

    prevPageBtn.addEventListener("click", () => { if (currentPage > 1) runSearch(currentPage - 1); });
    nextPageBtn.addEventListener("click", () => { if (currentPage < totalPages) runSearch(currentPage + 1); });

    // Auto-focus on load
    window.addEventListener("load", () => searchInput.focus());
})();
</script>
{% endblock %}
